<style>

<p><k v="The" z="voc">In the</k> article "Small Towns, Big Comeback" by Laura Bennett <k v="deals with" z="voc" n="1">it is about</k> young people. In the past <k v="" z="x">young people</k> left the small towns and the main streets emptied, but now they come back.</p>
<p>First<k v="," z="p"></k> the author <k v="explains" z="t" n="2">explained</k> that <k v="→ ③" z="cop" n="3">rent in cities has risen by more than 40 percent since 2020, while a family home in Millbrook still costs less than a two-bedroom apartment</k>. <k v="→ ④" z="cop" n="4">A nurse says "We could finally afford a garden".</k> Then<k v="," z="p"></k> Ben Huang<k v="," z="p"></k> who is a software developer<k v="," z="p"></k> <k v="has kept" z="t">kept</k> his job at a Seattle company. Because the town <k v="has" z="gr">have</k> fast internet<k v="," z="p"></k> he can work there.</p>
<p>The author also <k v="points out" z="gr voc" n="5">tell</k> that public transport is almost non-existent and there are <k v="fewer" z="voc" n="6">less</k> cultural events. <k v="However," z="reg">But</k> the mayor is very optimistic and I think she is right because young people <k v="revitalize" z="~">make the towns better</k>.</p>
</template>

    d.appendChild(g); return d;
  }

  var main = document.getElementById("inhalt"), nav = document.getElementById("sprung");
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function liste(arr, cls) { var ul = el("ul", cls); (arr || []).forEach(function (t) { ul.appendChild(el("li", null, t)); }); return ul; }
  function h2(nr, text) { return el("h2", null, (nr ? '<span class="zahl">' + nr + "</span>" : "") + text); }

  var daten;
  try { daten = JSON.parse(document.getElementById("daten").textContent); }
  catch (e) { main.appendChild(el("div", "fehler-daten", "Die Daten dieses Berichts konnten nicht gelesen werden. Bitte die Korrektur noch einmal anfordern.")); return; }
  if (daten.massstab) { var ms = document.getElementById("massstab"); ms.textContent = "Maßstab: " + daten.massstab; ms.hidden = false; }

  (daten.aufgaben || []).forEach(function (a, i) {
    var idx = i + 1, sec = el("section", "aufgabe"); sec.id = "aufgabe-" + idx;
    var titel = a.nummer ? "Aufgabe " + a.nummer : "Aufgabe " + idx;
    if ((daten.aufgaben || []).length > 1) { var l = el("a", null, titel); l.href = "#" + sec.id; nav.appendChild(l); }
    var kopf = el("div", "aufg-kopf"); kopf.appendChild(el("span", "nr", titel)); if (a.operator) kopf.appendChild(el("span", "chip", a.operator)); sec.appendChild(kopf);
    if (a.aufgabe) sec.appendChild(el("p", "aufg-text", a.aufgabe));

    // Profil
    var kp = el("div", "karte profil"); kp.appendChild(el("h3", null, "Dein Profil")); kp.appendChild(el("p", "unter", "Wo deine Stärken und Baustellen liegen – keine Note"));
    (a.profil || []).forEach(function (p) {
      var st = Math.max(0, Math.min(5, +p.stufe || 0));
      var z = el("div", "profil-zeile"); z.appendChild(el("div", "bereich", p.bereich));
      var m = el("div", "meter"), pips = el("div", "pips"); pips.setAttribute("role", "img"); pips.setAttribute("aria-label", p.bereich + ": " + st + " von 5, " + STUFEN[st]);
      for (var s = 1; s <= 5; s++) pips.appendChild(el("span", "pip" + (s <= st ? " an" : "")));
      m.appendChild(pips); m.appendChild(el("span", "stufe", STUFEN[st])); z.appendChild(m);
      if (p.kommentar) z.appendChild(el("div", "pkomm", p.kommentar));
      kp.appendChild(z);
    });
    sec.appendChild(kp);

    var sw = el("div", "sw");
    var ks = el("div", "karte staerken"); ks.appendChild(el("h3", null, "Das kannst du schon")); ks.appendChild(liste(a.staerken)); sw.appendChild(ks);
    var kw = el("div", "karte schwaechen"); kw.appendChild(el("h3", null, "Hier lohnt sich Üben")); kw.appendChild(liste(a.schwaechen)); sw.appendChild(kw);
    sec.appendChild(sw);

    function naechstes(arr) {
      if (!arr || !arr.length) return;
      sec.appendChild(el("span", "label l-nm", "Darauf achtest du beim nächsten Mal"));
      var ol = el("ol", "schritte"); arr.forEach(function (x) { ol.appendChild(el("li", null, x)); }); sec.appendChild(ol);
    }
    var nm = a.naechstesMal || {}; if (Array.isArray(nm)) nm = { sprache: nm };

    // 1 Korrigierter Text
    var tpl = document.getElementById("text-" + idx);
    if (tpl) {
      sec.appendChild(h2(1, "Dein korrigierter Text"));
      var blatt = el("div", "blatt"); blatt.appendChild(tpl.content.cloneNode(true));
      var teile = blatt.querySelectorAll("p[t]");
      teile.forEach(function (q) {
        var t = q.getAttribute("t"); q.classList.add("teil", "teil-" + t);
        var kopf = el("span", "teil-kopf"); kopf.appendChild(el("span", "tl", q.getAttribute("l") || t));
        if (q.getAttribute("h")) kopf.appendChild(el("span", "th", "⚠ " + q.getAttribute("h")));
        q.insertBefore(kopf, q.firstChild);
      });
      var zz = {};
      blatt.querySelectorAll("k").forEach(function (k) { String(k.getAttribute("z") || "").split(/\s+/).forEach(function (c) { if (!c) return; if (c === "~") c = "~~"; zz[c] = (zz[c] || 0) + 1; }); });
      sec.appendChild(legende(zz));
      blatt.querySelectorAll("k").forEach(function (k) {
        var orig = k.innerHTML, v = k.getAttribute("v") || "", z = k.getAttribute("z") || "", n = k.getAttribute("n");
        var s = el("span", "korr");
        if (z === "~") { s.innerHTML = '<ruby><span class="wellig"></span><rt></rt></ruby>'; s.querySelector(".wellig").innerHTML = orig; z = "~~"; }
        else if (z === "x") { s.innerHTML = '<ruby><span class="wdh"></span><rt></rt></ruby><span class="wdh-x">ⓧ</span>'; s.querySelector(".wdh").innerHTML = orig; }
        else if (orig.trim() === "") { s.innerHTML = '<ruby><span class="einf">‸</span><rt></rt></ruby>'; }
        else { s.innerHTML = "<ruby><del></del><rt></rt></ruby>"; s.querySelector("del").innerHTML = orig; }
        var nr = n ? (KREIS[+n - 1] || "(" + n + ")") : "", text = n && a.kommentare ? a.kommentare[+n - 1] : "";
        var rt = s.querySelector("rt"); rt.textContent = v;
        if (text && /[①-⑳]|\(\d+\)/.test(v)) { rt.textContent = ""; rt.appendChild(el("span", "nur-bild", "")).textContent = v.replace(/[①-⑳]|\(\d+\)/g, "i"); rt.appendChild(el("span", "nur-druck", "")).textContent = v; }
        if (text) {
          var id = "erkl-" + idx + "-" + n, b = el("button", "info", "i"); b.type = "button";
          b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-describedby", id); b.setAttribute("aria-label", "Erklärung anzeigen");
          var bl = el("span", "blase", text); bl.id = id; bl.setAttribute("role", "tooltip");
          var w = el("span", "info-wrap"); w.appendChild(b); w.appendChild(bl); s.appendChild(w); s.classList.add("mit-info");
        }
        var r = el("span", "rand"); r.innerHTML = z + (nr ? ' <span class="rn nur-druck">' + nr + "</span>" : ""); s.appendChild(r);
        k.replaceWith(s);
      });
      if (teile.length) { var lg = el("p", "aufbau-legende"); lg.appendChild(el("b", null, "Dein Aufbau:")); [["einleitung", "Einleitung / Schluss"], ["gegen", "gegen deine Meinung"], ["dafuer", "für deine Meinung"], ["gemischt", "unklar / gemischt"]].forEach(function (x) { lg.appendChild(el("span", "teil-" + x[0], x[1])); }); sec.appendChild(lg); }
      if (blatt.querySelector(".info")) { var hw = el("p", "info-hinweis"); hw.innerHTML = 'Hinter manchen Korrekturen steht ein blaues <span class="info" aria-hidden="true">i</span>. Fahr mit der Maus darüber oder tipp darauf, dann erscheint eine Erklärung.'; sec.appendChild(hw); }
      sec.appendChild(blatt);
      if (a.kommentare && a.kommentare.length) { var dk = el("div", "nur-druck"); dk.appendChild(el("h3", null, "Erklärungen")); var ok = el("ol", "kommentare"); a.kommentare.forEach(function (x) { ok.appendChild(el("li", null, x)); }); dk.appendChild(ok); sec.appendChild(dk); }
    }

    // 2 Inhalt und Aufbau
    sec.appendChild(h2(2, "Inhalt und Aufbau"));
    var inh = a.inhalt || {}, auf = a.aufbau || {};
    if (Array.isArray(auf)) auf = { schlecht: auf };
    if (Array.isArray(inh.aufbau)) auf = { gut: auf.gut || [], schlecht: (auf.schlecht || []).concat(inh.aufbau) };
    var inhS = (inh.schlecht || []).slice();
    [["fehlt", "Fehlt: "], ["falsch", "Falsch: "], ["ueberfluessig", "Überflüssig: "]].forEach(function (t) { (inh[t[0]] || []).forEach(function (x) { inhS.push(t[1] + x); }); });
    [["Inhalt", inh.gut || [], inhS], ["Aufbau", auf.gut || [], auf.schlecht || []]].forEach(function (b) {
      if (!b[1].length && !b[2].length) return;
      sec.appendChild(el("h3", "block-titel", b[0]));
      var g = el("div", "sw kompakt");
      if (b[1].length) { var kg = el("div", "karte staerken"); kg.appendChild(el("h3", null, "Gelungen")); kg.appendChild(liste(b[1])); g.appendChild(kg); }
      if (b[2].length) { var kz = el("div", "karte schwaechen"); kz.appendChild(el("h3", null, "Zu verbessern")); kz.appendChild(liste(b[2])); g.appendChild(kz); }
      sec.appendChild(g);
    });
    naechstes(nm.inhalt);

    // 3 Sprachliche Rückmeldung
    sec.appendChild(h2(3, "Sprache"));
    if (a.sprache) sec.appendChild(el("p", "sprache-text", a.sprache));
    naechstes(nm.sprache);

    main.appendChild(sec);
  });

  function rand() {
    document.querySelectorAll(".blatt").forEach(function (blatt) {
      var prev = null;
      blatt.querySelectorAll(".rand").forEach(function (r) { r.style.display = ""; if (r.dataset.t) r.innerHTML = r.dataset.t; else r.dataset.t = r.innerHTML; });
      blatt.querySelectorAll(".rand").forEach(function (r) { if (prev && Math.abs(r.offsetTop - prev.offsetTop) < 8) { prev.innerHTML += " " + r.innerHTML; r.style.display = "none"; } else prev = r; });
    });
  }
  rand(); window.addEventListener("resize", rand);
  if (window.matchMedia) window.matchMedia("print").addListener(rand);

  // Erklärungen: Hover (Maus) oder Tippen (Tablet)
  function platz(k) {
    var bl = k.querySelector(".blase"), blatt = k.closest(".blatt"); if (!bl || !blatt) return;
    bl.style.left = "-8px";
    var rb = blatt.getBoundingClientRect(), r = bl.getBoundingClientRect(), rechts = rb.right - 16, links = rb.left + 12;
    var dx = 0; if (r.right > rechts) dx = rechts - r.right; if (r.left + dx < links) dx = links - r.left;
    bl.style.left = (dx - 8) + "px";
  }
  function zu(ausser) { document.querySelectorAll(".korr.offen").forEach(function (k) { if (k !== ausser) { k.classList.remove("offen"); k.querySelector(".info").setAttribute("aria-expanded", "false"); } }); }
  document.querySelectorAll(".korr.mit-info").forEach(function (k) {
    var b = k.querySelector(".info");
    k.addEventListener("mouseenter", function () { platz(k); });
    k.addEventListener("click", function (e) {
      e.stopPropagation(); zu(k);
      var auf = !k.classList.contains("offen"); k.classList.toggle("offen", auf); b.setAttribute("aria-expanded", auf ? "true" : "false");
      if (auf) platz(k);
    });
    b.addEventListener("focus", function () { platz(k); });
  });
  document.addEventListener("click", function () { zu(null); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") zu(null); });
})();
</script>
